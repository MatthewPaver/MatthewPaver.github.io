name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# `store/` is the canonical source. The build copies it to `pages-dist/` and
# writes indexable detail pages under `/store/apps/<slug>/`.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate store catalogue
        run: node scripts/validate-store.mjs

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # pages-dist is store/ at the site root, plus nested store/apps/<slug>/
          # so legacy /store/apps/... bookmarks (e.g. marketing-ml-lakehouse) resolve.
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v5
