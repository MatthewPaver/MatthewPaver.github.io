name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The site currently deployed is the restored 19 May static store (top-level
# `store/`). The Astro source in src/ is retained but not deployed — restore
# the previous verify+dist pipeline from git history to bring it back.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate store catalogue
        run: node scripts/validate-store.mjs

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.mjs

      - name: Inject build SHA
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LONG_SHA="${GITHUB_SHA}"
          REPLACEMENT="id=\"build-sha\" href=\"https://github.com/MatthewPaver/MatthewPaver.github.io/commit/${LONG_SHA}\">${SHORT_SHA}"
          # Stamp every HTML page in the artifact, including nested /store/apps/ routes
          find pages-dist -name "*.html" -exec sed -i "s|id=\"build-sha\" href=\"[^\"]*\">dev|${REPLACEMENT}|g" {} +

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # pages-dist is store/ at the site root, plus nested store/apps/<slug>/
          # so legacy /store/apps/... bookmarks (e.g. marketing-ml-lakehouse) resolve.
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v5
