name: Temporary wording verification
on:
  push:
    branches: [explain-terms-in-context]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/portfolio
      - uses: actions/checkout@v7
        with:
          repository: MatthewPaver/ProjectLens
          ref: 888b71f486027de14d9cd94799d2ffd2bebccaad
          path: work/ProjectLens
      - uses: actions/checkout@v7
        with:
          repository: MatthewPaver/iam-policy-auditor
          ref: 20691ac7ff9691b12b59b44ae730471bf14685e4
          path: work/iam-policy-auditor
      - uses: actions/checkout@v7
        with:
          repository: MatthewPaver/rag-retrieval-gate
          ref: 322821dfb3b6431222c3876bb5b7a62bc4ad22e0
          path: work/rag-retrieval-gate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked browser tools
        run: |
          npm ci --ignore-scripts --prefix work/portfolio
          npm ci --ignore-scripts --prefix work/iam-policy-auditor
          python3 -m venv work/browser-venv
          work/browser-venv/bin/python -m pip install -r work/ProjectLens/requirements-browser.txt
          work/browser-venv/bin/python -m playwright install --with-deps chromium
          work/portfolio/node_modules/.bin/playwright install --with-deps chromium
          work/iam-policy-auditor/node_modules/.bin/playwright install --with-deps chromium
      - name: Check candidate pages and complete journeys
        run: |
          mkdir -p work/plain-language
          cp work/portfolio/scripts/wording-check-ui.py work/plain-language/check-ui.py
          cp work/portfolio/scripts/wording-verify-lifecycle.py work/plain-language/verify-lifecycle.py
          work/browser-venv/bin/python work/plain-language/verify-lifecycle.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plain-language-verification
          path: |
            work/plain-language/
            work/portfolio/store/assets/previews/*terms*
            work/portfolio/test-results/
            work/iam-policy-auditor/test-results/
