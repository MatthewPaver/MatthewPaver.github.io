<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Walk through the complete QuickSupply school-cover workflow across school, agency and teacher roles." />
    <meta name="theme-color" content="#2f1663" />
    <title>QuickSupply · Interactive product demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <header class="app-header">
      <a class="brand" href="./"><span class="logo">QS</span><span><strong>QuickSupply</strong><small>Cover operations</small></span></a>
      <div class="role-switcher">
        <span>VIEWING AS</span>
        <button data-role="agency" class="active">Agency</button>
        <button data-role="school">School</button>
        <button data-role="teacher">Teacher</button>
      </div>
      <button class="reset" id="reset">Reset demo</button>
    </header>
    <div class="boundary"><strong>INTERACTIVE DEMO</strong><span>Seeded schools, teachers and requests. No personal data, messages, payments or production service.</span></div>
    <div class="shell">
      <aside class="sidebar">
        <div class="role-card" id="role-card"></div>
        <nav id="navigation" aria-label="Role workspace"></nav>
        <div class="sidebar-foot"><span class="live-dot"></span><span>Demo workspace<br /><small>Local browser state</small></span></div>
      </aside>
      <main id="workspace" tabindex="-1"></main>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
