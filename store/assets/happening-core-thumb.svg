<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Happening Open Core product thumbnail</title>
  <desc id="desc">A terminal-style interface showing the one-command event data quality benchmark and its provenance, freshness, and coverage scores.</desc>
  <rect width="1200" height="675" fill="#fbfaf7"/>
  <rect x="54" y="52" width="1092" height="571" rx="0" fill="#ffffff" stroke="#151515" stroke-width="3"/>
  <rect x="54" y="52" width="1092" height="72" fill="#151515"/>
  <circle cx="94" cy="88" r="10" fill="#e76f51"/>
  <circle cx="126" cy="88" r="10" fill="#e9c46a"/>
  <circle cx="158" cy="88" r="10" fill="#2a9d8f"/>
  <text x="198" y="96" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Happening Open Core</text>
  <text x="944" y="95" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#7dd3c7">BENCHMARK CLI</text>

  <rect x="94" y="166" width="1012" height="120" fill="#151515"/>
  <text x="122" y="216" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#7dd3c7">$ python -m happening_core examples/events.json</text>
  <text x="122" y="256" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#ffffff">--reference examples/reference.json --fail-under 0.80</text>

  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif">
    <rect x="94" y="326" width="312" height="200" fill="#f4f0e9" stroke="#d8d2c8" stroke-width="2"/>
    <text x="122" y="372" font-size="17" font-weight="900" fill="#064e3b">PROVENANCE</text>
    <text x="122" y="452" font-size="52" font-weight="800" fill="#151515">Source</text>
    <text x="122" y="500" font-size="20" fill="#151515">per-record traceability</text>

    <rect x="444" y="326" width="312" height="200" fill="#f4f0e9" stroke="#d8d2c8" stroke-width="2"/>
    <text x="472" y="372" font-size="17" font-weight="900" fill="#064e3b">FRESHNESS</text>
    <text x="472" y="452" font-size="52" font-weight="800" fill="#151515">Dated</text>
    <text x="472" y="500" font-size="20" fill="#151515">timezone-aware checks</text>

    <rect x="794" y="326" width="312" height="200" fill="#f4f0e9" stroke="#d8d2c8" stroke-width="2"/>
    <text x="822" y="372" font-size="17" font-weight="900" fill="#064e3b">COVERAGE</text>
    <text x="822" y="452" font-size="52" font-weight="800" fill="#151515">Scored</text>
    <text x="822" y="500" font-size="20" fill="#151515">against a reference list</text>
  </g>

  <rect x="94" y="556" width="1012" height="2" fill="#d8d2c8"/>
  <text x="94" y="600" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f766e">quality_score: 0.925 · no third-party runtime dependencies</text>
</svg>
